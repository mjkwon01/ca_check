<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CA 계획점검 테스트</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap');

    /* ==========================================================================
       1. CA 테스트 앱 테마
       ========================================================================== */
    :root {
      --bg: #F3F3F3;
      --surface: #0C0D3D;
      --surface2: #F3F3F3;
      --surface3: #FFFFFF;
      --border: #C8CBD3;
      --accent: #CD636E;
      --accent2: #DFAAAF;
      --accent-text: #FFFFFF;
      --ok: #2ecc71;
      --ng: #e74c3c;
      --warn: #DB8D0F;
      --text: #000000;
      --text2: #FFFFFF;
      --text3: #5a5f7a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .app {
      max-width: 640px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
    }

    /* ==========================================================================
       2. 헤더와 탭
       ========================================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 16px 10px;
      background: var(--surface);
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .header-sub {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 10px 16px;
      background: var(--surface);
    }

    .tab-btn {
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .main {
      padding: 14px 16px 88px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface3);
      border: 0 solid var(--border);
    }

    .section-title {
      margin: 16px 0 10px;
      color: var(--surface);
      font-size: 13px;
      font-weight: 800;
    }

    .muted {
      color: var(--text3);
      font-size: 12px;
    }

    /* ==========================================================================
       3. 장소 선택
       ========================================================================== */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-label {
      flex: 0 0 auto;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .input-field {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .location-group {
      margin-bottom: 14px;
    }

    .location-group-title {
      margin-bottom: 6px;
      padding: 0 4px 5px;
      border-bottom: 1px solid var(--border);
      color: var(--surface);
      font-size: 14px;
      font-weight: 800;
    }

    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .location-btn {
      min-height: 44px;
      padding: 11px 10px;
      border: 0 solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface3);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .location-btn.selected {
      background: var(--accent2);
      color: var(--surface);
    }

    .start-area {
      position: sticky;
      bottom: 0;
      z-index: 10;
      margin: 0 -16px;
      padding: 12px 16px 16px;
      background: linear-gradient(to top, var(--bg) 72%, rgba(243, 243, 243, 0));
    }

    .btn-primary,
    .btn-secondary {
      width: 100%;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--surface);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--surface);
      color: var(--text2);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface3);
      color: var(--surface);
    }

    /* ==========================================================================
       4. 점검 입력
       ========================================================================== */
    .inspect-header {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text2);
    }

    .inspect-location-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .inspect-location {
      min-width: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .count-badge {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 800;
    }

    .inspect-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      color: var(--text2);
      font-size: 12px;
    }

    .equipment-group {
      margin-bottom: 12px;
    }

    .equipment-name {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text2);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .equipment-name::after {
      content: "접기";
      float: right;
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      font-weight: 700;
    }

    .equipment-group.collapsed .equipment-name::after {
      content: "열기";
    }

    .eq-items-container {
      display: block;
      margin-top: 8px;
    }

    .equipment-group.collapsed .eq-items-container {
      display: none;
    }

    .check-item,
    .ca-detail-card,
    .ca-detail-location-field {
      margin-bottom: 8px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--surface3);
      color: var(--text);
      border: 0 solid var(--border);
    }

    .check-item-top,
    .ca-detail-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .check-title,
    .ca-detail-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .check-desc,
    .ca-detail-label,
    .ca-detail-location-label {
      margin-top: 3px;
      color: var(--text3);
      font-size: 11px;
      line-height: 1.35;
    }

    .check-btns {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .check-btn,
    .ca-detail-ng-btn {
      width: 42px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text3);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .check-btn.ok-active {
      background: rgba(46, 204, 113, 0.16);
      border-color: var(--ok);
      color: var(--ok);
    }

    .check-btn.ng-active,
    .ca-detail-ng-btn.ng-active {
      background: rgba(231, 76, 60, 0.16);
      border-color: var(--ng);
      color: var(--ng);
    }

    .measure-row,
    .ca-detail-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .ca-detail-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .measure-wrap {
      display: flex;
      align-items: center;
      min-height: 40px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      overflow: hidden;
    }

    .measure-input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      text-align: center;
      outline: none;
    }

    .measure-unit {
      flex: 0 0 auto;
      padding-right: 10px;
      color: var(--text3);
      font-size: 11px;
      white-space: nowrap;
    }

    .memo-input,
    .run-memo-input {
      width: 100%;
      min-height: 58px;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

    .ca-detail-location-input {
      min-height: 44px;
      margin-top: 8px;
    }

    .save-status {
      min-height: 18px;
      margin-bottom: 8px;
      color: var(--text3);
      font-size: 12px;
    }

    .save-status.saving {
      color: var(--accent);
    }

    .save-status.error {
      color: var(--ng);
    }

    /* ==========================================================================
       5. 히스토리/대시보드/모달
       ========================================================================== */
    .filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-select {
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface3);
      color: var(--text);
    }

    .history-record,
    .dash-card,
    .compliance-card {
      margin-bottom: 10px;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--surface3);
    }

    .history-top,
    .dash-card {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .history-location,
    .dash-title,
    .compliance-location {
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .history-date,
    .dash-sub,
    .compliance-latest {
      color: var(--text3);
      font-size: 12px;
    }

    .dash-num {
      color: var(--accent);
      font-size: 28px;
      font-weight: 800;
    }

    .dash-num.ng {
      color: var(--ng);
    }

    .dash-num.memo {
      color: var(--warn);
    }

    .compliance-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }

    .compliance-group {
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent2);
      color: var(--surface);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .month-cell {
      min-height: 42px;
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text3);
      text-align: center;
      font-size: 11px;
    }

    .month-cell.checked {
      background: rgba(205, 99, 110, 0.18);
      color: var(--text);
      font-weight: 800;
    }

    .month-num {
      font-weight: 800;
    }

    .month-date {
      margin-top: 2px;
      color: var(--text3);
      font-size: 10px;
    }

    .empty {
      padding: 18px;
      color: var(--text3);
      text-align: center;
      font-size: 13px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.65);
      align-items: flex-end;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      margin: 0 auto;
      padding: 20px 16px 32px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--surface2);
      overflow-y: auto;
    }

    .save-done-panel {
      max-width: 300px;
      margin: auto;
      padding: 32px 24px;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text2);
      text-align: center;
    }

    .modal-title {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- =====================================================================
         1. 상단 헤더
         ===================================================================== -->
    <header class="header">
      <div class="header-title">CA 계획점검 테스트</div>
      <div class="header-sub">GAS 간이 버전 · 현장 입력감 확인용</div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="inspect" onclick="showTab('inspect')">점검</button>
      <button class="tab-btn" data-tab="history" onclick="showTab('history')">이력</button>
      <button class="tab-btn" data-tab="dashboard" onclick="showTab('dashboard')">대시보드</button>
      <button class="tab-btn" data-tab="memo" onclick="showTab('memo')">메모</button>
      <button class="tab-btn" data-tab="settings" onclick="showTab('settings')">설정</button>
    </nav>

    <main class="main">
      <!-- ===================================================================
           2. 점검 화면
           =================================================================== -->
      <section class="section active" id="sec-inspect">
        <div id="step-select">
          <div class="card">
            <div class="input-row">
              <div class="input-label">점검자</div>
              <input class="input-field" id="inspector-name" placeholder="이름을 입력하세요" oninput="updateStartButton()">
            </div>
          </div>

          <div id="location-list"><div class="empty">장소를 불러오는 중입니다.</div></div>

          <div class="start-area">
            <button class="btn-primary" id="btn-start" onclick="startInspection()" disabled>점검 시작</button>
          </div>
        </div>

        <div id="step-inspect" style="display:none;">
          <div class="inspect-header">
            <div class="inspect-location-row">
              <div class="inspect-location" id="cur-location"></div>
              <div class="count-badge" id="total-count"></div>
            </div>
            <div class="inspect-meta">
              <span>점검자: <b id="cur-inspector">-</b></span>
              <span>최근 점검일: <b id="recent-date">-</b></span>
            </div>
          </div>

          <div id="checklist-body"></div>

          <div class="card">
            <div class="section-title" style="margin-top:0;">점검 기록 비고</div>
            <textarea class="run-memo-input" id="run-memo" placeholder="장소 전체 특이사항을 입력합니다." oninput="setRunMemo(this.value)"></textarea>
          </div>

          <div class="save-status" id="save-status"></div>
          <button class="btn-primary" id="btn-save" onclick="saveResult()">데이터 저장</button>
          <button class="btn-secondary" style="margin-top:8px;" onclick="backToLocationSelect()">장소 선택으로 돌아가기</button>
        </div>
      </section>

      <!-- ===================================================================
           3. 히스토리 화면
           =================================================================== -->
      <section class="section" id="sec-history">
        <div class="filter-row">
          <select class="filter-select" id="history-filter-loc" onchange="renderHistory()">
            <option value="">전체 장소</option>
          </select>
          <select class="filter-select" id="history-filter-result" onchange="renderHistory()">
            <option value="">전체 결과</option>
            <option value="ng">X 포함</option>
            <option value="memo">메모 있음</option>
          </select>
        </div>
        <div id="history-list"><div class="empty">히스토리를 불러와 주세요.</div></div>
      </section>

      <!-- ===================================================================
           4. 대시보드 화면
           =================================================================== -->
      <section class="section" id="sec-dashboard">
        <div class="filter-row" style="grid-template-columns:repeat(3,1fr);">
          <button class="btn-secondary" onclick="setDashboardPeriod('month')">1개월</button>
          <button class="btn-secondary" onclick="setDashboardPeriod('3month')">3개월</button>
          <button class="btn-secondary" onclick="setDashboardPeriod('6month')">6개월</button>
        </div>
        <div id="dashboard-body"><div class="empty">대시보드를 불러오는 중입니다.</div></div>
      </section>

      <!-- ===================================================================
           5. 메모 검색 화면
           =================================================================== -->
      <section class="section" id="sec-memo">
        <div class="filter-row" style="grid-template-columns:minmax(0,1fr);">
          <input class="input-field" id="memo-query" placeholder="장소, 장비, 항목, 메모 검색" oninput="renderMemoRecords()">
        </div>
        <div id="memo-list"><div class="empty">메모를 불러와 주세요.</div></div>
      </section>

      <!-- ===================================================================
           6. 설정 화면
           =================================================================== -->
      <section class="section" id="sec-settings">
        <div class="card">
          <div class="section-title" style="margin-top:0;">스프레드시트 연결</div>
          <div class="muted">원본 스프레드시트 ID</div>
          <div style="margin-top:4px;font-size:12px;word-break:break-all;">1VCDFzlCj0BGWZ-roT086Pj2cOq1q-hsg04-brkh7WvQ</div>
          <button class="btn-primary" style="margin-top:12px;" onclick="syncChecklist()">원본 체크리스트 확인</button>
          <div class="save-status" id="settings-status"></div>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0;">제외한 기능</div>
          <div class="muted">계정 권한, 운영 로그, 엑셀 내보내기, NAS DB 동기화는 테스트용 GAS에서 제외했습니다.</div>
        </div>
      </section>
    </main>
  </div>

  <!-- 저장 완료 팝업 -->
  <div class="modal-overlay" id="save-done-modal">
    <div class="modal save-done-panel">
      <div style="font-size:16px;font-weight:800;margin-bottom:8px;">저장 완료</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:20px;">스프레드시트에 점검 기록을 저장했습니다.</div>
      <button class="btn-primary" onclick="afterSaveDone()">확인</button>
    </div>
  </div>

  <!-- 상세 팝업 -->
  <div class="modal-overlay" id="detail-modal" onclick="closeDetailModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="detail-title"></div>
      <div class="muted" id="detail-meta"></div>
      <div id="detail-body" style="margin-top:12px;"></div>
      <button class="btn-secondary" style="margin-top:12px;" onclick="closeDetailModalDirect()">닫기</button>
    </div>
  </div>

  <script>
    // ========================================================================
    // 1. 전역 상태와 서버 설정
    // ========================================================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx8xZzrxWsi43PwNez4RM6Opsp0Laa32g9-a4ILUG73MvBLXMFio6x_CHbAStgQiT3L-g/exec';

    let appData = { groups: [], locations: [] };
    let currentLocation = '';
    let currentItems = [];
    let checkResults = [];
    let runMemo = '';
    let historyCache = null;
    let memoCache = null;
    let lastInspectionDates = {};
    let dashPeriod = 'month';

    document.addEventListener('DOMContentLoaded', initApp);

    async function initApp() {
      loadInspectorName();
      await loadInit();
    }

    async function requestJson(params, options = {}) {
      const url = `${GAS_URL}?${new URLSearchParams(params).toString()}`;
      const response = await fetch(url, options);
      const data = await response.json();
      if (data.status && data.status !== 'ok') throw new Error(data.message || '요청 실패');
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function todayDateKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    // ========================================================================
    // 2. 장소 선택
    // ========================================================================
    async function loadInit() {
      const listEl = document.getElementById('location-list');
      try {
        appData = await requestJson({ action: 'init', t: Date.now() });
        lastInspectionDates = appData.lastDates || {};
        renderLocationList();
        renderHistoryFilter();
      } catch (err) {
        listEl.innerHTML = `<div class="empty">장소를 불러오지 못했습니다.<br>${escapeHtml(err.message)}</div>`;
      }
    }

    function renderLocationList() {
      const listEl = document.getElementById('location-list');
      const groups = appData.groups || [];
      const grouped = {};

      groups.forEach(item => {
        const group = item.group || '기타';
        if (!grouped[group]) grouped[group] = [];
        grouped[group].push(item.location);
      });

      if (!Object.keys(grouped).length) {
        listEl.innerHTML = '<div class="empty">장소 목록이 없습니다.</div>';
        return;
      }

      let html = '';
      Object.entries(grouped).forEach(([group, locations]) => {
        html += `<div class="location-group">
          <div class="location-group-title">${escapeHtml(group)}</div>
          <div class="location-grid">`;
        locations.forEach(location => {
          html += `<button class="location-btn" data-location="${escapeHtml(location)}" onclick="selectLocation('${encodeURIComponent(location)}')">${escapeHtml(location)}</button>`;
        });
        html += '</div></div>';
      });
      listEl.innerHTML = html;
    }

    function selectLocation(encodedLocation) {
      currentLocation = decodeURIComponent(encodedLocation);
      document.querySelectorAll('.location-btn').forEach(button => {
        button.classList.toggle('selected', button.dataset.location === currentLocation);
      });
      updateStartButton();
    }

    function updateStartButton() {
      const inspector = document.getElementById('inspector-name').value.trim();
      document.getElementById('btn-start').disabled = !inspector || !currentLocation;
    }

    function loadInspectorName() {
      const value = localStorage.getItem('ca_check_inspector') || '';
      document.getElementById('inspector-name').value = value;
    }

    function saveInspectorName() {
      localStorage.setItem('ca_check_inspector', document.getElementById('inspector-name').value.trim());
    }

    async function startInspection() {
      const inspector = document.getElementById('inspector-name').value.trim();
      if (!inspector) return alert('점검자를 입력해 주세요.');
      if (!currentLocation) return alert('장소를 선택해 주세요.');

      saveInspectorName();
      document.getElementById('btn-start').disabled = true;

      try {
        const data = await requestJson({ action: 'checklist', location: currentLocation, t: Date.now() });
        currentItems = data.items || [];
        checkResults = currentItems.map(item => ({
          result: isMeasurementOnlyItem(item) ? null : 'ok',
          measurementValue: '',
          memo: ''
        }));
        runMemo = '';
        document.getElementById('run-memo').value = '';
        document.getElementById('step-select').style.display = 'none';
        document.getElementById('step-inspect').style.display = 'block';
        document.getElementById('cur-location').textContent = currentLocation;
        document.getElementById('cur-inspector').textContent = inspector;
        document.getElementById('total-count').textContent = `${currentItems.length}개`;
        document.getElementById('recent-date').textContent = getRecentDateForLocation(currentLocation);
        renderChecklist();
      } catch (err) {
        alert(err.message || '체크리스트를 불러오지 못했습니다.');
      } finally {
        updateStartButton();
      }
    }

    function backToLocationSelect() {
      document.getElementById('step-inspect').style.display = 'none';
      document.getElementById('step-select').style.display = 'block';
      document.getElementById('save-status').textContent = '';
    }

    // ========================================================================
    // 3. 체크리스트 렌더링
    // ========================================================================
    function renderChecklist() {
      const grouped = {};
      currentItems.forEach((item, idx) => {
        const system = item.system || '시스템 미분류';
        if (!grouped[system]) grouped[system] = [];
        grouped[system].push({ ...item, idx });
      });

      let html = '';
      let groupIndex = 0;

      Object.entries(grouped).forEach(([systemName, items]) => {
        const collapsed = groupIndex > 0 ? ' collapsed' : '';
        html += `<div class="equipment-group${collapsed}">
          <div class="equipment-name" onclick="toggleAccordion(this)">${escapeHtml(systemName)}</div>
          <div class="eq-items-container">`;

        if (items.some(item => isCaDetailMeasurementItem(item))) {
          html += renderCaDetailGroup(items);
        } else {
          items.forEach(item => {
            html += renderNormalItem(item);
          });
        }

        html += '</div></div>';
        groupIndex += 1;
      });

      document.getElementById('checklist-body').innerHTML = html || '<div class="empty">점검 항목이 없습니다.</div>';
    }

    function renderNormalItem(item) {
      const idx = item.idx;
      const result = checkResults[idx]?.result;
      const measurementOnly = isMeasurementOnlyItem(item);
      const okBtn = measurementOnly ? '' : `<button class="check-btn ok ${result === 'ok' ? 'ok-active' : ''}" id="ok-${idx}" onclick="setResult(${idx}, 'ok')">O</button>`;
      const unitText = isCaOnuMeasurementItem(item) ? '0000 → 00.00' : '';
      const checkItemName = getItemCheckName(item);
      const methodText = getItemMethodText(item);
      const measureHtml = measurementOnly ? `
        <div class="measure-row">
          <div class="measure-wrap">
            <input class="measure-input" id="measurement-${idx}" inputmode="numeric" pattern="[0-9]*"
              placeholder="${isCaOnuMeasurementItem(item) ? '00.00' : '00.0'}"
              oninput="setMeasurement(${idx}, this.value)">
            <span class="measure-unit">${unitText}</span>
          </div>
        </div>` : '';

      return `<div class="check-item" id="item-${idx}">
        <div class="check-item-top">
          <div>
            <div class="check-title">[${escapeHtml(item.equipment || '-')}] ${escapeHtml(checkItemName)}</div>
            <div class="check-desc">${escapeHtml(methodText)}${item.standard ? ' · ' + escapeHtml(item.standard) : ''}</div>
          </div>
          <div class="check-btns">
            ${okBtn}
            <button class="check-btn ng ${result === 'ng' ? 'ng-active' : ''}" id="ng-${idx}" onclick="setResult(${idx}, 'ng')">X</button>
          </div>
        </div>
        ${measureHtml}
        <textarea class="memo-input" placeholder="특이사항을 입력해 주세요." oninput="setMemo(${idx}, this.value)"></textarea>
      </div>`;
    }

    function renderCaDetailGroup(items) {
      const locationItems = items.filter(item => isCaDetailLocationItem(item));
      const measureItems = items.filter(item => !isCaDetailLocationItem(item));
      const byEquipment = {};
      let html = '';

      locationItems.forEach(item => {
        const idx = item.idx;
        html += `<div class="ca-detail-location-field" id="item-${idx}">
          <div class="ca-detail-location-label">측정 위치</div>
          <textarea class="memo-input ca-detail-location-input" placeholder="측정 위치를 입력해 주세요."
            oninput="setDetailLocation(${idx}, this.value)"></textarea>
        </div>`;
      });

      measureItems.forEach(item => {
        const equipment = item.equipment || '장비';
        if (!byEquipment[equipment]) byEquipment[equipment] = [];
        byEquipment[equipment].push(item);
      });

      Object.entries(byEquipment).forEach(([equipment, detailItems]) => {
        const firstIdx = detailItems[0].idx;
        html += `<div class="ca-detail-card" id="ca-detail-card-${firstIdx}">
          <div class="ca-detail-card-head">
            <div class="ca-detail-title">${escapeHtml(equipment)}</div>
            <button class="ca-detail-ng-btn" id="ca-detail-ng-${firstIdx}"
              onclick="toggleCaDetailNg(${firstIdx}, '${detailItems.map(item => item.idx).join(',')}')">X</button>
          </div>
          <div class="ca-detail-grid">`;
        detailItems.forEach(item => {
          const idx = item.idx;
          const checkItemName = getItemCheckName(item);
          html += `<div>
            <div class="ca-detail-label" title="${escapeHtml(checkItemName)}">${escapeHtml(checkItemName)}</div>
            <div class="measure-wrap">
              <input class="measure-input" id="measurement-${idx}" inputmode="numeric" pattern="[0-9]*"
                placeholder="00.0" oninput="setCaDetailMeasurement(${idx}, this.value)">
            </div>
          </div>`;
        });
        html += `</div>
          <textarea class="memo-input" placeholder="특이사항을 입력해 주세요." oninput="setMemo(${firstIdx}, this.value)"></textarea>
        </div>`;
      });

      return html;
    }

    function toggleAccordion(header) {
      header.closest('.equipment-group').classList.toggle('collapsed');
    }

    function isCaDetailMeasurementItem(item) {
      return String(item.system || '').includes('상세측정');
    }

    function isCaDetailLocationItem(item) {
      return isCaDetailMeasurementItem(item) && String(getItemCheckName(item)).includes('측정 위치');
    }

    function isCaOnuMeasurementItem(item) {
      return String(item.system || '').includes('Optical') && String(item.equipment || '').includes('ONU');
    }

    function isMeasurementOnlyItem(item) {
      return isCaOnuMeasurementItem(item) || isCaDetailMeasurementItem(item);
    }

    function getItemCheckName(item) {
      return item.checkItem || item.item || '';
    }

    function getItemMethodText(item) {
      return item.method || item.checkMethod || item.desc || '';
    }

    // ========================================================================
    // 4. 입력값 저장 상태
    // ========================================================================
    function setResult(idx, result) {
      checkResults[idx].result = checkResults[idx].result === result && result === 'ng' ? 'ok' : result;
      const item = document.getElementById(`item-${idx}`);
      if (item) item.classList.toggle('result-ng', checkResults[idx].result === 'ng');
      const okButton = document.getElementById(`ok-${idx}`);
      const ngButton = document.getElementById(`ng-${idx}`);
      if (okButton) okButton.classList.toggle('ok-active', checkResults[idx].result === 'ok');
      if (ngButton) ngButton.classList.toggle('ng-active', checkResults[idx].result === 'ng');
    }

    function setMeasurement(idx, value) {
      const formatted = formatFixedDecimalDigits(value, 4, 2);
      checkResults[idx].measurementValue = formatted;
      checkResults[idx].result = formatted ? 'measurement' : null;
      const input = document.getElementById(`measurement-${idx}`);
      if (input && input.value !== formatted) input.value = formatted;
    }

    function setCaDetailMeasurement(idx, value) {
      const formatted = formatFixedDecimalDigits(value, 3, 1);
      checkResults[idx].measurementValue = formatted;
      checkResults[idx].result = formatted ? 'measurement' : null;
      const input = document.getElementById(`measurement-${idx}`);
      if (input && input.value !== formatted) input.value = formatted;
    }

    function setDetailLocation(idx, value) {
      checkResults[idx].measurementValue = value;
      checkResults[idx].result = value.trim() ? 'measurement' : null;
    }

    function setMemo(idx, value) {
      checkResults[idx].memo = value;
    }

    function setRunMemo(value) {
      runMemo = value;
    }

    function toggleCaDetailNg(firstIdx, csvIndexes) {
      const indexes = csvIndexes.split(',').map(value => Number(value)).filter(value => !Number.isNaN(value));
      const hasNg = indexes.some(idx => checkResults[idx]?.result === 'ng');
      indexes.forEach(idx => {
        checkResults[idx].result = hasNg ? (checkResults[idx].measurementValue ? 'measurement' : null) : 'ng';
      });
      const button = document.getElementById(`ca-detail-ng-${firstIdx}`);
      const card = document.getElementById(`ca-detail-card-${firstIdx}`);
      if (button) button.classList.toggle('ng-active', !hasNg);
      if (card) card.classList.toggle('result-ng', !hasNg);
    }

    function formatFixedDecimalDigits(value, maxDigits, decimalPlaces) {
      const digits = String(value || '').replace(/\D/g, '').slice(0, maxDigits);
      if (!digits) return '';
      const padded = digits.padStart(maxDigits, '0');
      const head = padded.slice(0, maxDigits - decimalPlaces);
      const tail = padded.slice(maxDigits - decimalPlaces);
      return `${head}.${tail}`;
    }

    // ========================================================================
    // 5. 저장
    // ========================================================================
    async function saveResult() {
      const inspector = document.getElementById('inspector-name').value.trim();
      const statusEl = document.getElementById('save-status');
      const button = document.getElementById('btn-save');

      if (!inspector) return alert('점검자를 입력해 주세요.');
      if (!currentLocation) return alert('장소가 선택되지 않았습니다.');

      const payload = {
        clientRecordId: `CA-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        date: todayDateKey(),
        location: currentLocation,
        inspector,
        recordMemo: runMemo,
        runMemo,
        items: currentItems.map((item, idx) => {
          const state = checkResults[idx] || {};
          const checkItemName = getItemCheckName(item);
          const methodText = getItemMethodText(item);
          return {
            sourceRow: item.sourceRow || 0,
            system: item.system || '',
            equipment: item.equipment || '',
            qty: item.qty || item.quantity || '',
            quantity: item.qty || item.quantity || '',
            checkItem: checkItemName,
            item: checkItemName,
            checkMethod: methodText,
            method: methodText,
            desc: methodText,
            standard: item.standard || item.criteria || '',
            result: state.result || '',
            measurementValue: state.measurementValue || '',
            memo: state.memo || ''
          };
        })
      };

      try {
        button.disabled = true;
        statusEl.textContent = '저장 중입니다.';
        statusEl.className = 'save-status saving';
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const data = await response.json();
        if (data.status && data.status !== 'ok') throw new Error(data.message || '저장 실패');
        historyCache = null;
        memoCache = null;
        document.getElementById('save-done-modal').classList.add('open');
      } catch (err) {
        statusEl.textContent = err.message || '저장에 실패했습니다.';
        statusEl.className = 'save-status error';
      } finally {
        button.disabled = false;
      }
    }

    function afterSaveDone() {
      document.getElementById('save-done-modal').classList.remove('open');
      backToLocationSelect();
    }

    // ========================================================================
    // 6. 히스토리
    // ========================================================================
    function renderHistoryFilter() {
      const select = document.getElementById('history-filter-loc');
      select.innerHTML = '<option value="">전체 장소</option>';
      (appData.locations || []).forEach(location => {
        select.innerHTML += `<option value="${escapeHtml(location)}">${escapeHtml(location)}</option>`;
      });
    }

    async function loadHistory() {
      if (historyCache) return historyCache;
      const data = await requestJson({ action: 'history', days: 90, t: Date.now() });
      historyCache = data.records || [];
      return historyCache;
    }

    async function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '<div class="empty">히스토리를 불러오는 중입니다.</div>';
      try {
        let records = await loadHistory();
        const loc = document.getElementById('history-filter-loc').value;
        const result = document.getElementById('history-filter-result').value;
        if (loc) records = records.filter(record => record.location === loc);
        if (result === 'ng') records = records.filter(record => record.items.some(item => item.result === 'ng'));
        if (result === 'memo') records = records.filter(record => hasCountableMemo(record.runMemo) || record.items.some(item => hasCountableMemo(item.memo)));
        if (!records.length) {
          container.innerHTML = '<div class="empty">표시할 히스토리가 없습니다.</div>';
          return;
        }
        container.innerHTML = records.map((record, idx) => {
          const ngCount = record.items.filter(item => item.result === 'ng').length;
          const memoCount = record.items.filter(item => hasCountableMemo(item.memo)).length + (hasCountableMemo(record.runMemo) ? 1 : 0);
          return `<div class="history-record" onclick="showDetail(${idx})">
            <div class="history-top">
              <div>
                <div class="history-location">${escapeHtml(record.location)}</div>
                <div class="history-date">${escapeHtml(record.date)} · 점검자: ${escapeHtml(record.inspector)}</div>
              </div>
              <div class="muted">X ${ngCount} · 메모 ${memoCount}</div>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty">히스토리 로드 실패<br>${escapeHtml(err.message)}</div>`;
      }
    }

    function getRecentDateForLocation(location) {
      if (lastInspectionDates[location]) return lastInspectionDates[location];
      const records = historyCache || [];
      const found = records.find(record => record.location === location);
      return found ? found.date : '기록 없음';
    }

    function showDetail(index) {
      const records = historyCache || [];
      const record = records[index];
      if (!record) return;
      document.getElementById('detail-title').textContent = record.location;
      document.getElementById('detail-meta').textContent = `${record.date} · 점검자: ${record.inspector}`;
      let html = '';
      if (hasCountableMemo(record.runMemo)) {
        html += `<div class="card"><b>점검 기록 비고</b><div class="muted">${escapeHtml(record.runMemo)}</div></div>`;
      }
      html += (record.items || []).map(item => {
        const value = item.measurementValue ? ` · 값 ${escapeHtml(item.measurementValue)}` : '';
        const memo = hasCountableMemo(item.memo) ? `<div class="muted">메모: ${escapeHtml(item.memo)}</div>` : '';
        return `<div class="card">
          <div><b>[${escapeHtml(item.equipment)}] ${escapeHtml(item.checkItem)}</b></div>
          <div class="muted">결과: ${escapeHtml(item.result || '-')} ${value}</div>
          ${memo}
        </div>`;
      }).join('');
      document.getElementById('detail-body').innerHTML = html;
      document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetailModal(event) {
      if (event.target.id === 'detail-modal') closeDetailModalDirect();
    }

    function closeDetailModalDirect() {
      document.getElementById('detail-modal').classList.remove('open');
    }

    // ========================================================================
    // 7. 대시보드와 메모
    // ========================================================================
    async function loadDashboard() {
      const body = document.getElementById('dashboard-body');
      body.innerHTML = '<div class="empty">대시보드를 불러오는 중입니다.</div>';
      try {
        const data = await requestJson({ action: 'dashboard', period: dashPeriod, t: Date.now() });
        renderDashboard(data);
      } catch (err) {
        body.innerHTML = `<div class="empty">대시보드 로드 실패<br>${escapeHtml(err.message)}</div>`;
      }
    }

    function setDashboardPeriod(period) {
      dashPeriod = period;
      loadDashboard();
    }

    function renderDashboard(data) {
      let html = '';
      html += `<div class="dash-card"><div><div class="dash-title">점검 횟수</div><div class="dash-sub">선택 기간 저장 건수</div></div><div class="dash-num">${data.inspectCount || 0}</div></div>`;
      html += `<div class="dash-card"><div><div class="dash-title">X 항목 수</div><div class="dash-sub">선택 기간 X 항목</div></div><div class="dash-num ng">${data.ngCount || 0}</div></div>`;
      html += `<div class="dash-card"><div><div class="dash-title">특이사항 수</div><div class="dash-sub">선택 기간 메모</div></div><div class="dash-num memo">${data.memoCount || 0}</div></div>`;
      html += '<div class="section-title">점검 이행 현황</div>';
      const rows = data.complianceRows || [];
      if (!rows.length) {
        html += '<div class="empty">점검 이행 현황 데이터가 없습니다.</div>';
      } else {
        rows.forEach(row => {
          html += `<div class="compliance-card">
            <div class="compliance-head">
              <div>
                <div class="compliance-location">${escapeHtml(row.location || '-')}</div>
                <div class="compliance-latest">${row.latestDate ? '최근 점검일 ' + escapeHtml(row.latestDate) : '점검 기록 없음'}</div>
              </div>
              <div class="compliance-group">${escapeHtml(row.group || '기타')}</div>
            </div>
            <div class="month-grid">`;
          for (let month = 1; month <= 12; month += 1) {
            const dates = (row.months && row.months[String(month)]) || [];
            const checked = dates.length > 0;
            html += `<div class="month-cell${checked ? ' checked' : ''}">
              <div class="month-num">${month}월</div>
              <div class="month-date">${checked ? escapeHtml(dates[dates.length - 1].slice(5)) : '-'}</div>
            </div>`;
          }
          html += '</div></div>';
        });
      }
      document.getElementById('dashboard-body').innerHTML = html;
    }

    async function loadMemoRecords() {
      if (memoCache) return memoCache;
      const data = await requestJson({ action: 'memoRecords', days: 365, t: Date.now() });
      memoCache = data.records || [];
      return memoCache;
    }

    async function renderMemoRecords() {
      const list = document.getElementById('memo-list');
      list.innerHTML = '<div class="empty">메모를 불러오는 중입니다.</div>';
      try {
        const query = document.getElementById('memo-query').value.trim().toLowerCase();
        let records = await loadMemoRecords();
        if (query) {
          records = records.filter(record => JSON.stringify(record).toLowerCase().includes(query));
        }
        if (!records.length) {
          list.innerHTML = '<div class="empty">표시할 메모가 없습니다.</div>';
          return;
        }
        list.innerHTML = records.map(record => `<div class="history-record">
          <div class="history-location">${escapeHtml(record.location)} · ${escapeHtml(record.equipment || '점검 기록')}</div>
          <div class="history-date">${escapeHtml(record.date)} · ${escapeHtml(record.checkItem || '비고')}</div>
          <div class="muted">${escapeHtml(record.memo)}</div>
        </div>`).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty">메모 로드 실패<br>${escapeHtml(err.message)}</div>`;
      }
    }

    function hasCountableMemo(value) {
      const text = String(value || '').trim();
      return !!text && text !== '-';
    }

    // ========================================================================
    // 8. 설정과 탭
    // ========================================================================
    async function syncChecklist() {
      const status = document.getElementById('settings-status');
      status.textContent = '확인 중입니다.';
      try {
        const data = await requestJson({ action: 'syncChecklist', t: Date.now() });
        status.textContent = `확인 완료: 장소 ${data.locations ? data.locations.length : 0}개`;
        await loadInit();
      } catch (err) {
        status.textContent = err.message || '확인 실패';
        status.className = 'save-status error';
      }
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
      document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
      document.getElementById(`sec-${tab}`).classList.add('active');
      if (tab === 'history') renderHistory();
      if (tab === 'dashboard') loadDashboard();
      if (tab === 'memo') renderMemoRecords();
    }
  </script>
</body>

</html>
